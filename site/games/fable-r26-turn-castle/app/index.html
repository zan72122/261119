<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4b8ee0">
<title>回転お城</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#4b8ee0, #cfe4f6 70%, #7dbb55 70%); }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; touch-action: none; overflow: hidden; }
  #stage canvas.gl { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .35s ease-out; }
  body.ready #stage canvas.gl { opacity: 1; }
  .ov-layer { position: absolute; inset: 0; pointer-events: none; }
  .ov-ripple { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,.9); box-sizing: border-box; animation: ripple .6s ease-out forwards; }
  .ov-ripple.strong { border-color: #ffe27a; box-shadow: 0 0 18px #fff6c4; }
  @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .ov-hand { position: absolute; left: 0; top: 0; width: 76px; height: 92px; opacity: 0; transform-origin: 14px 6px;
    filter: drop-shadow(0 3px 4px rgba(60,30,80,.35)); display: none; }
  .ov-hand.show { display: block; }
  .ov-replay { position: absolute; right: calc(24px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom));
    width: 128px; height: 128px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer;
    transform: scale(0); transition: transform .45s cubic-bezier(.3,1.6,.5,1); touch-action: none; }
  .ov-replay.show { transform: scale(1); animation: bob 1.4s ease-in-out .5s infinite; }
  @keyframes bob { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.08) rotate(-8deg); } }
  .ov-veil { position: absolute; inset: 0; background: rgba(255,240,250,.55); opacity: 0; transition: opacity .3s; }
  .ov-veil.show { opacity: 1; }
  .dbg { position: absolute; left: 6px; top: 6px; margin: 0; padding: 6px 8px; max-width: calc(100% - 24px); white-space: pre-wrap;
    font: 11px/1.35 ui-monospace, Menlo, monospace; color: #e8ffe8; background: rgba(0,0,0,.6); border-radius: 6px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<!-- Classic scripts only: ES modules cannot load from file:// in Chrome. hero.bundle.js is built from app/hero/hero.js. -->
<script defer src="vendor/three.iife.min.js"></script>
<script defer src="shell/config.js"></script>
<script defer src="shell/debug.js"></script>
<script defer src="shell/textures.js"></script>
<script defer src="shell/scene.js"></script>
<script defer src="shell/input.js"></script>
<script defer src="shell/audio.js"></script>
<script defer src="shell/overlay.js"></script>
<script defer src="hero/hero.bundle.js"></script>
<script defer src="shell/main.js"></script>
</body>
</html>
