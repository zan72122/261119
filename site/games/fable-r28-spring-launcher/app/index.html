<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd0f5">
<title>巨大ばね発射場</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0f5; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }
  /* 起動中：文字は出さず、やわらかく脈打つ丸だけ */
  #boot { position: fixed; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
          background: #fff; opacity: .8; animation: b 1s ease-in-out infinite alternate; pointer-events: none; transition: opacity .4s; }
  body.ready #boot { opacity: 0; }
  @keyframes b { from { transform: scale(.7); } to { transform: scale(1); } }
  .hint-hand { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; z-index: 5;
               filter: drop-shadow(0 4px 6px rgba(60,30,50,.35)); transform-origin: 40% 10%; will-change: transform, opacity; }
  .hint-ring { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; z-index: 4; border-radius: 50%;
               border: 6px solid rgba(255,255,255,.95); box-sizing: border-box; will-change: transform, opacity; }
  .debug { position: fixed; left: 6px; top: 6px; z-index: 10; background: rgba(0,0,0,.6); color: #cfe; padding: 6px 8px;
           border-radius: 6px; font: 11px/1.35 ui-monospace, Menlo, monospace; max-width: 96vw; }
  .debug pre { margin: 0; white-space: pre-wrap; }
  .debug button { margin: 4px 4px 0 0; font: 11px ui-monospace, monospace; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot"></div>
<script>
  // file:// では ES モジュールを読めない（Chrome）ので、ビルド済みの束を読む。
  // http(s)（GitHub Pages）ではソースの ES モジュールをそのまま読む。
  (function () {
    function add(src, module) {
      var s = document.createElement('script');
      if (module) s.type = 'module';
      s.src = src;
      s.async = false;
      document.head.appendChild(s);
    }
    if (location.protocol === 'file:') {
      add('dist/tex-embed.js', false);
      add('dist/app.js', false);
    } else {
      add('shell/main.js', true);
    }
  })();
</script>
</body>
</html>
