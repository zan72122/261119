<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e9e4">
<title>てまわしミシン</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6e9e4; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  /* 起動中のくるくる（文字なし） */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f6e9e4; transition: opacity .5s; z-index: 5; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot i { width: 64px; height: 64px; border-radius: 50%; border: 10px solid #f3c6cf; border-top-color: #8fcfc0; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ヒントの輪・動きの点・指の波紋 */
  .ring { position: absolute; border-radius: 50%; border: 6px solid rgba(255,255,255,.95); box-shadow: 0 0 0 4px rgba(255,170,190,.55), 0 0 24px rgba(255,220,150,.8);
          transform: translate(-50%,-50%); animation: ringpulse 1.2s ease-in-out infinite; }
  @keyframes ringpulse { 0%,100% { transform: translate(-50%,-50%) scale(.9); opacity: .75; } 50% { transform: translate(-50%,-50%) scale(1.08); opacity: 1; } }
  .dot { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(255,255,255,.95); box-shadow: 0 0 12px rgba(255,190,120,.9); }
  .ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid rgba(255,255,255,.9); animation: ripple .6s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  #debug { position: fixed; left: 6px; top: 6px; z-index: 10; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #fff; background: rgba(20,20,30,.72);
           padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; max-width: 92vw; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<div id="boot"><i></i></div>
<!-- すべて classic script（file:// でも GitHub Pages でも動く。実行時のネットワークなし） -->
<script src="vendor/three.iife.js"></script>
<script src="assets/textures.js"></script>
<script src="hero/hero.bundle.js"></script>
<script src="shell/shell.bundle.js"></script>
</body>
</html>
