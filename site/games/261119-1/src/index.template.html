<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ドレッサー</title>
<link rel="preload" href="vendor/three.min.js" as="script">
<link rel="preload" href="app.js?v=__VER__" as="script">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #15110e;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  #gl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #fallback { position: absolute; inset: 0; display: none; background: #15110e center / contain no-repeat; }
  #veil { position: absolute; inset: 0; background: #fff8ee; opacity: 0; pointer-events: none; }
  /* a soft still of the opening view, shown at once while the 3D room is prepared; fades into the real frame */
  #poster { position: absolute; inset: 0; overflow: hidden; pointer-events: none; background: #e9e2d8;
    transition: opacity 0.8s ease; }
  #poster i { position: absolute; inset: -24px; background: center / cover no-repeat url("__POSTER_P__");
    filter: blur(10px); }
  @media (min-aspect-ratio: 3/4) { #poster i { background-image: url("__POSTER_L__"); } }
  #poster b { position: absolute; left: 50%; bottom: 12%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
    background: #fff8ee; opacity: 0.0; animation: gfbreath 1.6s ease-in-out 0.6s infinite; }
  @keyframes gfbreath { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.75; transform: scale(1.25); } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="veil"></div>
<div id="fallback" data-img="src/fallback.jpg"></div>
<div id="poster"><i></i><b></b></div>
<script defer src="vendor/three.min.js"></script>
<script defer src="app.js?v=__VER__"></script>
</body>
</html>
