<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#acd1fc">
<title>のびる はし</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #acd1fc; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* loading: a slowly turning gear (no text) */
  .r25-boot { position: fixed; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px;
              animation: r25spin 3s linear infinite; opacity: .8; pointer-events: none; }
  body.ready .r25-boot { display: none; }
  @keyframes r25spin { to { transform: rotate(360deg); } }
  /* finger hint */
  .r25-hint { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
              transition: opacity .2s; z-index: 5; will-change: transform; }
  .r25-hand { position: absolute; left: -22px; top: -6px; filter: drop-shadow(0 3px 4px rgba(40,30,80,.35)); }
  .r25-ring { position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%;
              border: 5px solid rgba(255,255,255,.9); box-sizing: border-box; }
  /* replay */
  .r25-replay { position: fixed; left: 50%; bottom: 7%; width: 150px; height: 150px; margin-left: -75px;
                border-radius: 50%; background: #fff; box-shadow: 0 8px 24px rgba(40,60,120,.35);
                padding: 22px; box-sizing: border-box; z-index: 6; transform: scale(0); transition: transform .5s cubic-bezier(.3,1.6,.5,1);
                touch-action: none; }
  .r25-replay.show { transform: scale(1); animation: r25pulse 1.6s ease-in-out .6s infinite; }
  @keyframes r25pulse { 50% { transform: scale(1.08); } }
  /* debug overlay (?debug=1) — not for children */
  .r25-debug { position: fixed; left: 6px; top: 6px; z-index: 10; background: rgba(0,0,0,.62); color: #dfffd8;
               font: 11px/1.35 ui-monospace, Menlo, monospace; padding: 6px 8px; border-radius: 6px; max-width: 96vw; }
  .r25-debug pre { margin: 0; white-space: pre-wrap; pointer-events: none; }
  .r25-debug .bad { color: #ff7070; }
  .r25-debug button { margin: 4px 4px 0 0; font: 11px ui-monospace, monospace; }
  body.nogl .r25-boot { animation: none; opacity: .4; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg class="r25-boot" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="#ffffff" stroke="#7aa4d8" stroke-width="3">
  <path d="M-6,-46 h12 l2,10 l9,4 l8,-6 l9,9 l-6,8 l4,9 l10,2 v12 l-10,2 l-4,9 l6,8 l-9,9 l-8,-6 l-9,4 l-2,10 h-12 l-2,-10 l-9,-4 l-8,6 l-9,-9 l6,-8 l-4,-9 l-10,-2 v-12 l10,-2 l4,-9 l-6,-8 l9,-9 l8,6 l9,-4 z"/>
  <circle r="12" fill="#acd1fc"/></g></svg>
<script>
  // Start everything the first scene needs at once, in parallel:
  //  - code: the one-file minified bundle dist/game.js (three tree-shaken + shell + hero).
  //    ?module=1 loads the ES modules (shell/main.js) instead, for development over http.
  //  - textures: over http(s) the JPEGs themselves (decoded off the main thread);
  //    from file:// the same images as data URIs (assets/texpack.js), because WebGL may not
  //    use file:// images. Rebuild both with `npm run build`.
  (function () {
    var file = location.protocol === 'file:';
    var module = !file && /[?&]module=1/.test(location.search);
    if (file) {
      var p = document.createElement('script');
      p.src = 'assets/texpack.js';
      p.async = false;
      document.body.appendChild(p);
    } else {
      var pre = window.R25_PRELOAD = {};
      ['sky_512.jpg', 'mountains_512.jpg', 'cliff_512.jpg', 'grass_512.jpg', 'wood_512.jpg', 'wood_1024.jpg'].forEach(function (n) {
        var img = new Image();
        img.decoding = 'async';
        img.src = 'assets/' + n;
        pre[n] = img;
      });
    }
    var s = document.createElement('script');
    if (module) { s.type = 'module'; s.src = 'shell/main.js'; }
    else { s.src = 'dist/game.js'; s.async = false; }
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
